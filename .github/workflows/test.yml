name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      # onnxruntime-node fetches its CUDA build from NuGet on Linux unless told: no GPU here, and a slow fetch failed the run
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:node
      # a sound device for the pages: without one Chromium plays to a fake sink whose clock runs ahead of real time,
      # which the recording and playback tests measure; a PulseAudio null sink keeps it real time, as on a user's
      # machine. After the Node tests: Node's speaker would play through it too, its latency in their wall clock
      - run: sudo apt-get install -y pulseaudio && pulseaudio --start --exit-idle-time=-1 && pactl info
      - run: npm run test:pages
        env:
          TEST_PAGES: library
      # real-time playback, clicks and gaps measured as heard: a shared runner misses the audio thread's deadlines now
      # and then, so this one advises and doesn't fail the run
      - run: npm run test:browser
        continue-on-error: true
        env:
          TEST_PAGES: playback
      # and recording with the live spectrogram shown, drawn on the CPU here (no GPU): advice too
      - run: node --test --test-name-pattern="recording with the spectrogram shown" test/playground.test.js
        continue-on-error: true
        env:
          CI: ''
  # the README's runtimes besides Node: a file decoded, edited, measured, encoded and decoded back (test/runtime.js)
  runtimes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      - uses: oven-sh/setup-bun@v2
      - run: bun test/runtime.js
      - uses: denoland/setup-deno@v2
      # from npm the library's bare `fs` imports resolve as Node's; from a checkout Deno needs them allowed
      - run: deno run -A --unstable-bare-node-builtins test/runtime.js
  # audio/polyfill against Chromium's own element (test/polyfill.js), on a real-time sound device as the pages get
  polyfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get install -y pulseaudio && pulseaudio --start --exit-idle-time=-1 && pactl info
      - run: node test/.speaker-start.mjs; pactl list short modules; pactl unload-module module-suspend-on-idle; node test/.speaker-start.mjs; pactl list short sinks
      - run: npm run test:polyfill
  # action.yml as another repo uses it: a file within its spec passes, one outside it fails the step
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./
        with:
          files: test/fixture.wav
          spec: streaming
      - id: off
        uses: ./
        continue-on-error: true
        with:
          files: test/fixture.wav
          spec: broadcast
      - run: test "${{ steps.off.outcome }}" = failure
