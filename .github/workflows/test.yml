name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      # onnxruntime-node fetches its CUDA build from NuGet on Linux unless told: no GPU here, and a slow fetch failed the run
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      - run: npm run build
      - run: npm run test:node
  # the README's runtimes besides Node: a file decoded, edited, measured, encoded and decoded back (test/runtime.js)
  runtimes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      - uses: oven-sh/setup-bun@v2
      - run: bun test/runtime.js
      - uses: denoland/setup-deno@v2
      # from npm the library's bare `fs` imports resolve as Node's; from a checkout Deno needs them allowed
      - run: deno run -A --unstable-bare-node-builtins test/runtime.js
  # audio/polyfill against Chromium's own element (test/polyfill.js), on a real-time sound device as the pages get
  polyfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      - run: npx playwright install --with-deps chromium
      # the null sink suspended as it idles: idle, it renders 2 s of silence ahead and a new stream waits that out
      # (pacat's too), where a hardware sink takes it back (alsa-sink.c, "Requesting rewind due to latency change")
      - run: sudo apt-get install -y pulseaudio && pulseaudio --start --exit-idle-time=-1 && pactl info && pactl unload-module module-suspend-on-idle && pactl load-module module-suspend-on-idle timeout=0
      - run: npm run test:polyfill
  # action.yml as another repo uses it: a file within its spec passes, one outside it fails the step
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./
        with:
          files: test/fixture.wav
          spec: streaming
      - id: off
        uses: ./
        continue-on-error: true
        with:
          files: test/fixture.wav
          spec: broadcast
      - run: test "${{ steps.off.outcome }}" = failure
