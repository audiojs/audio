name: pages
# The website, built: the bundles in assets/ and the repl's engine in repl/dist/ (which git ignores) made
# from this commit, the site as served in _site, the repl's page minified there (node .site-build.js _site), then
# deployed and opened as a visitor would (test/live.js)
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      # the repository as served, its dot-files and node_modules left out (.site-build.js site)
      - run: node .site-build.js _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
      - run: npx playwright install --with-deps chromium
      - run: node test/live.js ${{ steps.deploy.outputs.page_url }}
