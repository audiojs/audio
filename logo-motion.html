<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>audio logo motion</title>
  <link rel="icon" href="logo.svg">
  <link rel="preload" href="assets/geist.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="logo.css">
</head>
<body>
  <div class="stage">
    <nav class="pages"><a href="logo.html">Lab</a><a href="logo-motion.html" aria-current="page">Motion</a></nav>
    <div class="corner">
      <label for="print">Print</label>
      <select id="print" name="print"><button><selectedcontent></selectedcontent></button></select>
      <button type="button" class="toggle" id="invert" aria-pressed="false" aria-label="Invert" title="Invert"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 1.5a6.5 6.5 0 0 1 0 13z" fill="currentColor"/></svg></button>
    </div>
    <canvas tabindex="0" aria-label="The logo. Drag it sideways to turn it, let go to fling it; tap it, or press Space, for the next waveform; the arrows nudge it."></canvas>
    <p class="fail" id="fail" hidden>This page needs WebGL 2.</p>
  </div>

  <form class="bar" id="controls">
    <div class="grid">
      <label for="rest">Rest</label>
      <select id="rest" name="rest"><button><selectedcontent></selectedcontent></button></select>
      <label for="hover">Hover</label>
      <select id="hover" name="hover"><button><selectedcontent></selectedcontent></button></select>
      <label for="lift">Lift</label>
      <select id="lift" name="lift"><button><selectedcontent></selectedcontent></button></select>
      <label for="sound">Sound</label>
      <select id="sound" name="sound"><button><selectedcontent></selectedcontent></button></select>
    </div>
  </form>

  <script type="module">
  import { logo, DITHERS, SCREENS, label } from './logo.js'
  import { motion, RESTS, HOVERS, LIFTS, SOUNDS } from './logo-motion.js'

  const $ = s => document.querySelector(s)
  const root = document.documentElement, canvas = $('canvas'), form = $('#controls'), invert = $('#invert'), print = $('#print')
  const view = logo(canvas)
  if (!view) $('#fail').hidden = false

  const offer = (select, names, chosen, draw) => {
    for (const name of names) {
      if (!name) { select.append(document.createElement('hr')); continue }
      const option = new Option('', name)
      option.innerHTML = `${draw?.(name) ?? ''}<span>${label(name)}</span>`
      select.append(option)
    }
    select.value = chosen
  }
  offer(form.elements.rest, Object.keys(RESTS), 'drift')
  offer(form.elements.hover, Object.keys(HOVERS), 'stir')
  offer(form.elements.lift, LIFTS, 'none')
  offer(form.elements.sound, SOUNDS, 'ticks')
  offer(print, [...DITHERS, null, ...SCREENS], 'bayer4', view && (name => `<span class="icon mask" style="mask-image: url('${view.icon(name)}')"></span>`))

  const answer = view && motion(view, canvas, Object.fromEntries(new FormData(form)))
  const paint = () => {
    root.classList.toggle('invert', invert.ariaPressed === 'true')
    const css = getComputedStyle(root)
    view?.set({ print: print.value, ground: css.getPropertyValue('--ground'), figure: css.getPropertyValue('--figure') })
  }
  form.addEventListener('input', () => answer?.set(Object.fromEntries(new FormData(form))))
  print.addEventListener('input', paint)
  invert.addEventListener('click', () => { invert.ariaPressed = String(invert.ariaPressed !== 'true'); paint() })
  paint()
  </script>
</body>
</html>
